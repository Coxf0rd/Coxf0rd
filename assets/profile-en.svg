  <text x="60" y="372" class="body">
    <tspan x="60" dy="0">I build software and tools for Linux systems, network infrastructure and</tspan>
    <tspan x="60" dy="30">automation. I'm interested in backend development, traffic routing and</tspan>
    <tspan x="60" dy="30">DevOps practices. My main focus is engineering work: understanding</tspan>
    <tspan x="60" dy="30">architecture, deploying services and diagnosing systems.</tspan>
  </text>
